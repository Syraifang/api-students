basePath: /api/v1
definitions:
  model.AuthUser:
    properties:
      email:
        type: string
      role:
        type: string
      userID:
        type: integer
    type: object
  model.Course:
    properties:
      id:
        type: integer
      kode_mk:
        type: string
      kuota:
        type: integer
      nama_mk:
        type: string
      semester:
        type: integer
      sisa_kuota:
        type: integer
      sks:
        type: integer
      terisi:
        type: integer
    type: object
  model.CreateReviewRequest:
    properties:
      comment:
        type: string
      rating:
        type: integer
      tags:
        items:
          type: string
        type: array
    type: object
  model.ErrorResponse:
    properties:
      code:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
      request_id:
        type: string
      success:
        type: boolean
    type: object
  model.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  model.Meta:
    properties:
      current_page:
        type: integer
      last_page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
    type: object
  model.MyCourses:
    properties:
      courses:
        items:
          $ref: '#/definitions/model.Course'
        type: array
      max_credits:
        type: integer
      total_credits:
        type: integer
    type: object
  model.Notification:
    properties:
      body:
        type: string
      channel:
        type: string
      id:
        type: integer
      outbox_id:
        type: integer
      sent_at:
        type: string
      subject:
        type: string
      user_id:
        type: integer
    type: object
  model.QueueInfo:
    properties:
      active:
        type: integer
      archived:
        type: integer
      completed:
        type: integer
      failed_today:
        type: integer
      name:
        type: string
      pending:
        type: integer
      processed_today:
        type: integer
      retry:
        type: integer
      scheduled:
        type: integer
    type: object
  model.QueueStats:
    properties:
      notifications_sent:
        type: integer
      oldest_pending_age:
        type: string
      outbox_pending:
        type: integer
      outbox_published:
        type: integer
      queue:
        $ref: '#/definitions/model.QueueInfo'
      queue_error:
        type: string
    type: object
  model.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  model.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  model.Reply:
    properties:
      comment:
        type: string
      created_at:
        type: string
      id:
        type: string
      user_id:
        type: integer
    type: object
  model.Review:
    properties:
      comment:
        type: string
      course_id:
        type: integer
      created_at:
        type: string
      id:
        type: string
      rating:
        type: integer
      replies:
        items:
          $ref: '#/definitions/model.Reply'
        type: array
      tags:
        items:
          type: string
        type: array
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  model.ReviewPage:
    properties:
      data:
        items:
          $ref: '#/definitions/model.Review'
        type: array
      message:
        type: string
      meta:
        $ref: '#/definitions/model.ReviewPageMeta'
      success:
        type: boolean
    type: object
  model.ReviewPageMeta:
    properties:
      has_more:
        type: boolean
      limit:
        type: integer
      next_before:
        type: string
    type: object
  model.ReviewSummary:
    properties:
      average_rating:
        type: number
      tag_counts:
        additionalProperties:
          type: integer
        type: object
      total_reviews:
        type: integer
    type: object
  model.Student:
    properties:
      angkatan:
        type: integer
      deleted_at:
        description: Untuk fitur soft delete
        type: string
      id:
        type: integer
      ipk_terakhir:
        type: number
      nama:
        type: string
      nim:
        description: 12 digit, uniq
        type: string
      prodi:
        type: string
      user_id:
        description: Relasi ke tabel users
        type: integer
    type: object
  model.StudentCreateRequest:
    properties:
      angkatan:
        minimum: 2000
        type: integer
      email:
        type: string
      ipk_terakhir:
        maximum: 4
        minimum: 0
        type: number
      nama:
        type: string
      nim:
        type: string
      prodi:
        type: string
    required:
    - angkatan
    - email
    - nama
    - nim
    - prodi
    type: object
  model.StudentDetailResponse:
    properties:
      angkatan:
        type: integer
      batas_sks:
        type: integer
      deleted_at:
        description: Untuk fitur soft delete
        type: string
      id:
        type: integer
      ipk_terakhir:
        type: number
      mata_kuliah_diambil:
        items:
          $ref: '#/definitions/model.Course'
        type: array
      nama:
        type: string
      nim:
        description: 12 digit, uniq
        type: string
      prodi:
        type: string
      total_sks:
        type: integer
      user_id:
        description: Relasi ke tabel users
        type: integer
    type: object
  model.StudentUpdateRequest:
    properties:
      angkatan:
        minimum: 2000
        type: integer
      ipk_terakhir:
        maximum: 4
        minimum: 0
        type: number
      nama:
        type: string
      prodi:
        type: string
    required:
    - angkatan
    - nama
    - prodi
    type: object
  model.SwapRequest:
    properties:
      from_course_id:
        type: integer
      to_course_id:
        type: integer
    type: object
  model.TokenPair:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  model.User:
    properties:
      email:
        type: string
      id:
        type: integer
      role:
        type: string
    type: object
  model.WebResponse:
    properties:
      data: {}
      errors:
        description: Dipakai untuk error validasi bersarang
      message:
        type: string
      meta:
        $ref: '#/definitions/model.Meta'
      success:
        type: boolean
    type: object
info:
  contact: {}
  description: |-
    API pendaftaran kelas (KRS), ulasan kelas, dan notifikasi.
    Seluruh endpoint selain /auth memerlukan access token.
  title: API KRS Praktikum Backend Lanjut
  version: "1.0"
paths:
  /admin/queue:
    get:
      description: Membutuhkan permission queue:monitor. Tetap menjawab 200 saat Redis
        mati; field queue_error menjelaskan sebabnya.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.QueueStats'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Keadaan outbox dan queue (admin)
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      description: Dibatasi 5 kali gagal per menit per IP.
      parameters:
      - description: Email dan password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.TokenPair'
              type: object
        "401":
          description: Email atau password salah
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "429":
          description: Terlalu banyak percobaan login
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Login dan mendapatkan pasangan token
      tags:
      - auth
  /auth/logout:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.WebResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout dan mencabut refresh token
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.AuthUser'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mendapatkan profil pengguna yang sedang login
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh token lama langsung dicabut (rotation).
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.TokenPair'
              type: object
        "401":
          description: Refresh token tidak valid atau kedaluwarsa
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Menukar refresh token dengan pasangan token baru
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Role akun baru selalu "user". Password minimal 8 karakter.
      parameters:
      - description: Data akun baru
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
        "400":
          description: Body bukan JSON yang valid
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Email/username sudah dipakai
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Validasi gagal
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Mendaftarkan akun baru
      tags:
      - auth
  /courses:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Course'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Daftar seluruh kelas
      tags:
      - courses
  /courses/{id}:
    get:
      parameters:
      - description: ID kelas
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Course'
              type: object
        "400":
          description: ID bukan angka positif
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Detail satu kelas
      tags:
      - courses
  /courses/{id}/enroll:
    delete:
      parameters:
      - description: ID kelas
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Berhasil keluar; tanpa body
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: NOT_ENROLLED
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Keluar dari sebuah kelas
      tags:
      - courses
    post:
      description: |-
        Mengambil satu kursi dan mencatat event enrollment.created ke outbox dalam SATU transaction.
        Kode error 409: COURSE_FULL, ALREADY_ENROLLED, CREDIT_LIMIT_EXCEEDED.
      parameters:
      - description: ID kelas
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Course'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Kuota penuh, sudah terdaftar, atau batas SKS terlampaui
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mendaftar ke sebuah kelas
      tags:
      - courses
  /courses/{id}/reviews:
    get:
      description: 'Cursor pagination: kirim meta.next_before sebagai parameter before
        untuk halaman berikutnya.'
      parameters:
      - description: ID kelas
        in: path
        name: id
        required: true
        type: integer
      - description: Saring berdasarkan tag
        in: query
        name: tag
        type: string
      - description: 'Cursor: id ulasan terakhir yang sudah dilihat'
        in: query
        name: before
        type: string
      - default: 10
        description: Jumlah per halaman, 1 sampai 50
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ReviewPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Daftar ulasan sebuah kelas, terbaru lebih dulu
      tags:
      - reviews
    post:
      consumes:
      - application/json
      description: Hanya peserta kelas. Satu mahasiswa hanya boleh menulis satu ulasan
        per kelas.
      parameters:
      - description: ID kelas
        in: path
        name: id
        required: true
        type: integer
      - description: Isi ulasan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.CreateReviewRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Review'
              type: object
        "403":
          description: NOT_ENROLLED
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: ALREADY_REVIEWED
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Menulis ulasan untuk sebuah kelas
      tags:
      - reviews
  /courses/{id}/reviews/summary:
    get:
      parameters:
      - description: ID kelas
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.ReviewSummary'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Ringkasan ulasan sebuah kelas (D.3)
      tags:
      - reviews
  /courses/mine:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.MyCourses'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: KRS milik mahasiswa yang sedang login
      tags:
      - courses
  /enrollments/swap:
    post:
      consumes:
      - application/json
      description: Keluar dari kelas lama dan masuk ke kelas baru sebagai satu tindakan.
        Bila kelas baru penuh, mahasiswa tetap di kelas lama.
      parameters:
      - description: Kelas asal dan kelas tujuan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.SwapRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Course'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: COURSE_FULL, NOT_ENROLLED, CREDIT_LIMIT_EXCEEDED
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Pindah kelas
      tags:
      - courses
  /notifications/mine:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Notification'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Notifikasi milik mahasiswa yang sedang login
      tags:
      - notifications
  /reviews/{id}:
    delete:
      parameters:
      - description: ID ulasan
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.WebResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Menghapus ulasan (D.3)
      tags:
      - reviews
    get:
      parameters:
      - description: ID ulasan
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Review'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Detail ulasan berdasarkan ID (D.3)
      tags:
      - reviews
  /students:
    get:
      parameters:
      - description: Halaman
        in: query
        name: page
        type: integer
      - description: Jumlah per halaman
        in: query
        name: per_page
        type: integer
      - description: Filter Program Studi
        in: query
        name: prodi
        type: string
      - description: Pencarian Nama / NIM
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Student'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Daftar seluruh mahasiswa (D.3)
      tags:
      - students
    post:
      consumes:
      - application/json
      parameters:
      - description: Data Mahasiswa
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.StudentCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Student'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Menambah data mahasiswa baru (D.3)
      tags:
      - students
  /students/{id}:
    delete:
      parameters:
      - description: ID Mahasiswa
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.WebResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Menghapus data mahasiswa (D.3)
      tags:
      - students
    get:
      parameters:
      - description: ID Mahasiswa
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.StudentDetailResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Detail data mahasiswa (D.3)
      tags:
      - students
    put:
      consumes:
      - application/json
      parameters:
      - description: ID Mahasiswa
        in: path
        name: id
        required: true
        type: integer
      - description: Data Mahasiswa Baru
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.StudentUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Student'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mengubah data mahasiswa (D.3)
      tags:
